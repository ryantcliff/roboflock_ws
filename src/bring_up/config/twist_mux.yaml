twist_mux:
  ros__parameters:
    # Output is remapped to /cmd_vel_mux in bringup.launch.py; diff_drive_controller
    # subscribes there in follow mode.
    topics:
      navigation:
        # Nav2's velocity_smoother output (navigation_launch.py remaps it to /cmd_vel).
        topic: /cmd_vel
        timeout: 0.5
        priority: 10
      joystick:
        topic: /cmd_vel_joy
        timeout: 0.5
        priority: 100
      estop:
        # ultrasonic_estop only publishes while an obstacle is within
        # min_safe_distance; a short timeout means twist_mux falls back to
        # navigation/joystick within ~0.3s of the obstacle clearing.
        topic: /cmd_vel_estop
        timeout: 0.3
        priority: 200
